// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/fang.cfg, then run: exec fang

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1024
sensitivity 1.1
zoom_sensitivity_ratio 1
viewmodel_fov 66
viewmodel_offset_x 2
viewmodel_offset_y 1
