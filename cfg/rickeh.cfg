// Rickeh - CS2 config from https://copyprosta.com/p/rickeh/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/rickeh.cfg, then run: exec rickeh

cl_crosshairstyle 4
cl_crosshair_length 6
cl_crosshair_thickness 2
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 50
cl_crosshaircolor_b 50
cl_crosshaircolor_a 200
cl_crosshair_screen_height 1050
sensitivity 1
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1
