// HObbit - CS2 config from https://copyprosta.com/p/hobbit/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/hobbit.cfg, then run: exec hobbit

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
m_pitch 0.022
sensitivity 1.25
zoom_sensitivity_ratio 0.86
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1
viewmodel_presetpos 1
cl_radar_scale 0.398048
cl_radar_rotate 1
cl_hud_radar_scale 0.900808
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
cl_showfps 0
hud_scaling 1
cl_hud_color 1
hud_showtargetid 1
cl_drawhud_force_radar 0
cl_teammate_colors_show 1
cl_allow_animated_avatars 1
cl_show_clan_in_death_notice 1
cl_teamcounter_playercount_instead_of_avatars 0
cl_showloadout 0
cl_silencer_mode 0
option_duck_method 0
r_fullscreen_gamma 2.2
option_speed_method 0
