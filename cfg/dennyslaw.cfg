// dennyslaw - CS2 config from https://copyprosta.com/p/dennyslaw/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/dennyslaw.cfg, then run: exec dennyslaw

cl_crosshairstyle 4
cl_crosshair_length 7
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 255
cl_crosshaircolor_b 155
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1050
sensitivity 1.4
zoom_sensitivity_ratio 1
r_fullscreen_gamma 1.1
