// nyezin - CS2 config from https://copyprosta.com/p/nyezin/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/nyezin.cfg, then run: exec nyezin

cl_crosshairstyle 4
cl_crosshair_length 1
cl_crosshair_thickness 1
cl_crosshair_gap 0
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 255
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
sensitivity 1
zoom_sensitivity_ratio 1.2
viewmodel_fov 54
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.95
cl_hud_color 9
fps_max 0
cl_showloadout 1
r_fullscreen_gamma 2.1
