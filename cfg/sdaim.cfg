// Sdaim - CS2 config from https://copyprosta.com/p/sdaim/
// From the settings settings.gg lists for this player; the crosshair is copied
// as listed (already in the format CS2 uses since the Sept 2026 update).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/sdaim.cfg, then run: exec sdaim

cl_crosshairstyle 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 29
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_spread_limit 226
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 0
cl_crosshair_screen_height 960
sensitivity 0.8
zoom_sensitivity_ratio 1
viewmodel_fov 62
viewmodel_offset_x 1.5
viewmodel_offset_y 2
viewmodel_offset_z -1.5
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 0
hud_scaling 0.9
cl_hud_color 0
fps_max 0
r_fullscreen_gamma 2
cl_ironsight_dot_scale 1
cl_ironsight_usecrosshaircolor 0
