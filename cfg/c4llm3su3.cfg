// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/c4llm3su3.cfg, then run: exec c4llm3su3

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 200
cl_crosshair_screen_height 960
sensitivity 0.95
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 1.5
viewmodel_offset_z -2
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 1
cl_hud_color 9
fps_max 0
r_fullscreen_gamma 1.6
