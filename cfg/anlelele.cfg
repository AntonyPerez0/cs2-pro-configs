// Anlelele - CS2 config from https://copyprosta.com/p/anlelele/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/anlelele.cfg, then run: exec anlelele

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 200
cl_crosshair_screen_height 960
sensitivity 1.35
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -1.75
cl_radar_scale 0.6
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 1
cl_hud_color 0
r_fullscreen_gamma 2.6
