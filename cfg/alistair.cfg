// aliStair - CS2 config from https://copyprosta.com/p/alistair/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/alistair.cfg, then run: exec alistair

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 1.9
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1.5
cl_radar_scale 0.45
cl_radar_rotate 1
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 0
safezonex 1
safezoney 1
hud_scaling 0.95
cl_hud_color 1
cl_showloadout 1
r_fullscreen_gamma 2
r_player_visibility_mode 1
