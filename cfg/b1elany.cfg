// b1elany - CS2 config from https://copyprosta.com/p/b1elany/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/b1elany.cfg, then run: exec b1elany

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 3
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshair_drawoutline 2
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1080
sensitivity 0.4
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 1
cl_radar_rotate 1
cl_hud_radar_scale 0.9
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 0.9
cl_hud_color 4
fps_max 0
cl_showloadout 1
r_fullscreen_gamma 2
