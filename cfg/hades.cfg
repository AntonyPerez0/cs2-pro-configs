// hades - CS2 config from https://copyprosta.com/p/hades/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/hades.cfg, then run: exec hades

cl_crosshairstyle 2
cl_crosshair_length 1
cl_crosshair_thickness 2
cl_crosshair_gap 0
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 200
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_screen_height 960
m_yaw 0.022
m_pitch 0.022
sensitivity 2.4
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 1
cl_radar_scale 0.7
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
cl_showfps 0
hud_scaling 1
cl_hud_color 0
hud_showtargetid 1
cl_drawhud_force_radar 0
cl_teammate_colors_show 1
cl_allow_animated_avatars 1
cl_show_clan_in_death_notice 1
cl_teamcounter_playercount_instead_of_avatars 0
fps_max 400
cl_showloadout 0
cl_silencer_mode 0
option_duck_method 0
r_fullscreen_gamma 2.2
option_speed_method 0
r_player_visibility_mode 0
