// avid - CS2 config from https://copyprosta.com/p/avid/
// From the settings settings.gg lists for this player; the crosshair is copied
// as listed (already in the format CS2 uses since the Sept 2026 update).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/avid.cfg, then run: exec avid

cl_crosshairstyle 4
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 243
cl_crosshaircolor_g 10
cl_crosshaircolor_b 10
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_splitalpha_innermod 0
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_dynamic_maxdist_splitratio 1
cl_crosshair_dynamic_spread_limit 255
cl_ironsight_usecrosshaircolor 1
cl_ironsight_dot_scale 0.47
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 4
cl_crosshair_screen_height 1080
sensitivity 1.1
zoom_sensitivity_ratio 0.8189330271
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -2
cl_radar_scale 0.25
cl_hud_radar_scale 1
hud_scaling 0.9
cl_hud_color 0
cl_ironsight_dot_scale 0.47
cl_ironsight_usecrosshaircolor 1
