// leakz - CS2 config from https://copyprosta.com/p/leakz/
// From the settings settings.gg lists for this player; the crosshair is copied
// as listed (already in the format CS2 uses since the Sept 2026 update).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/leakz.cfg, then run: exec leakz

cl_crosshairstyle 4
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 0
cl_crosshaircolor_b 255
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 6
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.45
cl_crosshair_dynamic_maxdist_splitratio 0.3
cl_crosshair_dynamic_spread_limit 227
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_length 4
cl_crosshair_thickness 2
cl_crosshair_gap 3
cl_crosshair_screen_height 960
sensitivity 2.2
zoom_sensitivity_ratio 3
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.7
cl_radar_rotate 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 0.95
r_fullscreen_gamma 2.2
cl_ironsight_dot_scale 1
cl_ironsight_usecrosshaircolor 0
