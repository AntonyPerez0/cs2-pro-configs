// Semphis - Cloud9, January 2015, CS:GO config from 2013
// https://copyprosta.com/classic/c9-ibp-2015/semphis/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/semphis-c9-ibp-2015.cfg, then run: exec semphis-c9-ibp-2015

cl_crosshairstyle 4
cl_crosshair_length 6
cl_crosshair_thickness 1
cl_crosshair_gap 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_screen_height 900
sensitivity 1.7
zoom_sensitivity_ratio 1
m_pitch 0.022
m_yaw 0.022
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 3
cl_radar_scale 0.25
cl_radar_always_centered 0
cl_radar_rotate 1
cl_radar_icon_scale_min 0.6
hud_scaling 0.95
hud_showtargetid 0
safezonex 1
safezoney 1
cl_prefer_lefthanded 0
cl_showloadout 1
