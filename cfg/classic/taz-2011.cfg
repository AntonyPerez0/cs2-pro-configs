// TaZ - #6 of 2011, CS:GO config from 2016-04-29 - https://copyprosta.com/classic/2011/taz/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/taz-2011.cfg, then run: exec taz-2011

cl_crosshairstyle 5
cl_crosshair_length 8
cl_crosshair_thickness 2
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 768
sensitivity 1.8
zoom_sensitivity_ratio 1
m_pitch 0.022
m_yaw 0.022
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 3
cl_hud_radar_scale 1.005
cl_radar_scale 0.7
cl_radar_always_centered 1
cl_radar_rotate 1
cl_radar_icon_scale_min 0.6
hud_scaling 0.9
cl_hud_color 2
hud_showtargetid 1
cl_prefer_lefthanded 0
