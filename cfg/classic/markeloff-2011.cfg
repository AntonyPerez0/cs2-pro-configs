// markeloff - #3 HLTV Top 20 of 2011, CS:GO config from 2015-03-12
// https://copyprosta.com/classic/2011/markeloff/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/markeloff-2011.cfg, then run: exec markeloff-2011

cl_crosshairstyle 5
cl_crosshair_length 8
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 720
sensitivity 2
