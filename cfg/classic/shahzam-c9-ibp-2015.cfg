// ShahZaM - Cloud9, January 2015, CS:GO config from 2023-10-19
// https://copyprosta.com/classic/c9-ibp-2015/shahzam/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/shahzam-c9-ibp-2015.cfg, then run: exec shahzam-c9-ibp-2015

cl_crosshairstyle 4
cl_crosshair_length 3
cl_crosshair_thickness 1
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 200
cl_crosshair_screen_height 768
sensitivity 1.7
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1.5
viewmodel_presetpos 1
cl_radar_always_centered 1
cl_radar_rotate 1
cl_radar_square_with_scoreboard 0
cl_hud_radar_scale 1
cl_radar_scale 0.4
hud_scaling 0.9
