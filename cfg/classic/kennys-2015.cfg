// kennyS - #6 HLTV Top 20 of 2015, CS:GO config from 2014-04
// https://copyprosta.com/classic/2015/kennys/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/kennys-2015.cfg, then run: exec kennys-2015

cl_crosshairstyle 4
cl_crosshair_length 5
cl_crosshair_thickness 2
cl_crosshair_gap 4
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 200
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 200
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 768
sensitivity 2.2
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
viewmodel_presetpos 3
cl_radar_scale 0.7
cl_radar_rotate 1
cl_radar_always_centered 1
cl_radar_icon_scale_min 0.6
hud_scaling 0.9
hud_showtargetid 1
cl_teammate_colors_show 1
cl_prefer_lefthanded 1
