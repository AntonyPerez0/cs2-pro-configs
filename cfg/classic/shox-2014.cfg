// shox - #8 HLTV Top 20 of 2014, CS:GO config from 2014-07
// https://copyprosta.com/classic/2014/shox/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/shox-2014.cfg, then run: exec shox-2014

cl_crosshairstyle 2
cl_crosshair_length 3
cl_crosshair_thickness 2
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 5
cl_crosshair_dynamic_maxdist_splitratio 0
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 1
cl_crosshair_screen_height 768
sensitivity 3
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1.5
viewmodel_presetpos 1
cl_hud_radar_scale 1
cl_radar_scale 0.505
cl_radar_always_centered 1
cl_radar_rotate 1
cl_radar_icon_scale_min 0.6
cl_radar_square_with_scoreboard 1
cl_hud_color 8
hud_scaling 0.9
cl_teammate_colors_show 1
cl_prefer_lefthanded 0
