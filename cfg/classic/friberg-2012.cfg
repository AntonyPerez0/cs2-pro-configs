// friberg - #4 of 2012, CS:GO config from 2012-12-13 - https://copyprosta.com/classic/2012/friberg/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/friberg-2012.cfg, then run: exec friberg-2012

cl_crosshairstyle 2
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1024
sensitivity 1.4
zoom_sensitivity_ratio 1
m_pitch 0.022
m_yaw 0.022
