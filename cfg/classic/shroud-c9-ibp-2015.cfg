// shroud - Cloud9, January 2015, CS:GO config from 2014-07
// https://copyprosta.com/classic/c9-ibp-2015/shroud/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/shroud-c9-ibp-2015.cfg, then run: exec shroud-c9-ibp-2015

cl_crosshairstyle 4
cl_crosshair_length 8
cl_crosshair_thickness 2
cl_crosshair_gap 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 1080
sensitivity 2.1375
zoom_sensitivity_ratio 1
m_pitch 0.022
m_yaw 0.022
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 1
viewmodel_offset_z -1.5
viewmodel_presetpos 0
cl_hud_radar_scale 1.005
cl_radar_scale 0.5
cl_radar_always_centered 0
cl_radar_rotate 1
cl_radar_icon_scale_min 1
hud_scaling 0.95
hud_showtargetid 1
cl_hud_color 1
cl_teamcounter_playercount_instead_of_avatars 1
cl_teammate_colors_show 2
safezonex 1
safezoney 1
cl_prefer_lefthanded 0
cl_showloadout 0
