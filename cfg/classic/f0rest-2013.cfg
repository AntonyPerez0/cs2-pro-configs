// f0rest - #2 HLTV Top 20 of 2013, CS:GO config from 2013-12-06
// https://copyprosta.com/classic/2013/f0rest/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/f0rest-2013.cfg, then run: exec f0rest-2013

cl_crosshairstyle 4
cl_crosshair_length 11
cl_crosshair_thickness 2
cl_crosshair_gap 4
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 900
sensitivity 3.5
