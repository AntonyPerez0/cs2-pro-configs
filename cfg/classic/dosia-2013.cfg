// Dosia - #4 HLTV Top 20 of 2013, CS:GO config from 2016-04-29
// https://copyprosta.com/classic/2013/dosia/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/dosia-2013.cfg, then run: exec dosia-2013

cl_crosshairstyle 4
cl_crosshair_length 6
cl_crosshair_thickness 1
cl_crosshair_gap 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 200
cl_crosshair_screen_height 768
sensitivity 2
zoom_sensitivity_ratio 0.8
m_pitch 0.022
m_yaw 0.022
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 3
hud_scaling 0.9
cl_prefer_lefthanded 0
