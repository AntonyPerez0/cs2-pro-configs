// device - #3 HLTV Top 20 of 2015, CS:GO config from 2014
// https://copyprosta.com/classic/2015/device/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/device-2015.cfg, then run: exec device-2015

cl_crosshairstyle 4
cl_crosshair_length 5
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 960
sensitivity 2.2
zoom_sensitivity_ratio 1
m_pitch 0.022
m_yaw 0.022
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -2
cl_radar_always_centered 1
cl_radar_rotate 1
cl_radar_scale 0.4375
cl_radar_icon_scale_min 0.6
cl_hud_color 1
cl_showfps 1
cl_teammate_colors_show 0
hud_showtargetid 0
cl_prefer_lefthanded 0
