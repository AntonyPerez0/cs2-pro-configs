// GuardiaN - #2 HLTV Top 20 of 2015, CS:GO config from 2022-04-30
// https://copyprosta.com/classic/2015/guardian/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/guardian-2015.cfg, then run: exec guardian-2015

cl_crosshairstyle 4
cl_crosshair_length 1
cl_crosshair_thickness 1
cl_crosshair_gap 3
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 600
sensitivity 1.3
zoom_sensitivity_ratio 1.2
m_pitch 0.022
m_yaw 0.022
