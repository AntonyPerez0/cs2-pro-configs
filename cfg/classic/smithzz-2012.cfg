// SmithZz - #8 of 2012, CS:GO config from 2013 - https://copyprosta.com/classic/2012/smithzz/
// Converted for CS2: crosshair converted to the Sept 2026 crosshair system (community
// reconstruction); convars CS2 renamed are renamed, ones it no longer has are left out.
// Save as Counter-Strike Global Offensive/game/csgo/cfg/smithzz-2012.cfg, then run: exec smithzz-2012

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 2
cl_crosshair_gap 4
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 208
cl_crosshaircolor_b 251
cl_crosshaircolor_a 255
cl_crosshair_screen_height 768
sensitivity 1.88
zoom_sensitivity_ratio 0.9
viewmodel_fov 65
viewmodel_offset_x 2
viewmodel_offset_y 0
viewmodel_offset_z -2
hud_scaling 0.9
hud_showtargetid 0.75
