// RUSH - CS2 config from https://copyprosta.com/p/rush/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/rush.cfg, then run: exec rush

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_screen_height 800
sensitivity 1.3
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.35
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.9
cl_hud_color 0
cl_showloadout 0
r_fullscreen_gamma 1.1
