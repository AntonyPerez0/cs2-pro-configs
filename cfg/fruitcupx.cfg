// Fruitcupx - CS2 config from https://copyprosta.com/p/fruitcupx/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/fruitcupx.cfg, then run: exec fruitcupx

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 960
sensitivity 2.2
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 0
viewmodel_offset_z -2
cl_radar_scale 0.25
cl_hud_radar_scale 1
hud_scaling 0.9
cl_hud_color 0
r_fullscreen_gamma 2.2
