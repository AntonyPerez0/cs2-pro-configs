// Tapewaare - CS2 config from https://copyprosta.com/p/tapewaare/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/tapewaare.cfg, then run: exec tapewaare

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 1
zoom_sensitivity_ratio 0.9
viewmodel_fov 68
viewmodel_offset_x -0.5
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_radar_scale 0.4
cl_radar_rotate 1
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 1
cl_allow_animated_avatars 0
fps_max 0
fps_max_ui 0
cl_showloadout 1
r_fullscreen_gamma 1.7
