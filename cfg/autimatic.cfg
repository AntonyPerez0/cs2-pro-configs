// autimatic - CS2 config from https://copyprosta.com/p/autimatic/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/autimatic.cfg, then run: exec autimatic

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 1080
sensitivity 1.125
zoom_sensitivity_ratio 0.9
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_radar_scale 0.45
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 0.9
cl_hud_color 9
r_fullscreen_gamma 2
