// L1haNg - CS2 config from https://copyprosta.com/p/l1hang/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/l1hang.cfg, then run: exec l1hang

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 1
