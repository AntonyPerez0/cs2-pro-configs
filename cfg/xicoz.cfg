// xicoz - CS2 config from https://copyprosta.com/p/xicoz/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/xicoz.cfg, then run: exec xicoz

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 0
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 172
cl_crosshaircolor_b 170
cl_crosshaircolor_a 255
cl_crosshair_screen_height 864
sensitivity 0.7
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
hud_scaling 1.1
cl_hud_color 3
r_fullscreen_gamma 2.3
