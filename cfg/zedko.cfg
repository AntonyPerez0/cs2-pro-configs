// ZEDKO - CS2 config from https://copyprosta.com/p/zedko/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/zedko.cfg, then run: exec zedko

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 3
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 864
m_yaw 0.022
sensitivity 0.49
zoom_sensitivity_ratio 0.5
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.25
cl_radar_rotate 1
cl_hud_radar_scale 0.995
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.95
cl_hud_color 5
cl_showloadout 0
r_fullscreen_gamma 1.1
