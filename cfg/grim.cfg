// Grim - CS2 config from https://copyprosta.com/p/grim/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/grim.cfg, then run: exec grim

cl_crosshairstyle 4
cl_crosshair_length 16
cl_crosshair_thickness 3
cl_crosshair_gap 5
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 200
cl_crosshair_screen_height 1080
m_yaw 0.022
m_pitch 0.022
sensitivity 0.72
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y -2
viewmodel_offset_z -2
viewmodel_presetpos 1
cl_radar_scale 0.3
cl_radar_rotate 1
cl_hud_radar_scale 1.3
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 0.99
cl_showfps 0
hud_scaling 1
cl_hud_color 5
hud_showtargetid 1
cl_drawhud_force_radar 0
cl_teammate_colors_show 1
cl_allow_animated_avatars 0
cl_show_clan_in_death_notice 1
cl_teamcounter_playercount_instead_of_avatars 0
cl_showloadout 0
cl_silencer_mode 0
option_duck_method 0
r_fullscreen_gamma 3
option_speed_method 0
