// Peppzor - CS2 config from https://copyprosta.com/p/peppzor/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/peppzor.cfg, then run: exec peppzor

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 2.2
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.510952
cl_radar_rotate 1
cl_hud_radar_scale 1.237611
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 0.916788
safezoney 1
hud_scaling 0.9
cl_hud_color 0
cl_showloadout 1
r_fullscreen_gamma 1.1
r_player_visibility_mode 1
