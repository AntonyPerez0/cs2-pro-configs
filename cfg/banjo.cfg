// Banjo - CS2 config from https://copyprosta.com/p/banjo/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/banjo.cfg, then run: exec banjo

cl_crosshairstyle 4
cl_crosshair_length 1
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 160
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 1
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0.3025
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_icon_scale_min 1.15
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 0.9
safezoney 0.9
hud_scaling 0.85
cl_hud_color 7
cl_showloadout 1
r_fullscreen_gamma 2.5
r_player_visibility_mode 1
