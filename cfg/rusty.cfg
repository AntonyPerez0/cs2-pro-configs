// RuStY - CS2 config from https://copyprosta.com/p/rusty/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/rusty.cfg, then run: exec rusty

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 250
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 1.7
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 1
viewmodel_offset_z -2
cl_radar_scale 0.45
cl_radar_rotate 1
cl_hud_radar_scale 0.83
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.833
cl_hud_color 2
cl_showloadout 1
r_fullscreen_gamma 1.1
r_player_visibility_mode 1
