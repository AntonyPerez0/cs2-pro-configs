// Wolffe - CS2 config from https://copyprosta.com/p/wolffe/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/wolffe.cfg, then run: exec wolffe

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1080
sensitivity 1.8
zoom_sensitivity_ratio 1
viewmodel_fov null
viewmodel_offset_x null
viewmodel_offset_y null
viewmodel_offset_z null
cl_radar_scale 0
cl_hud_radar_scale 1
hud_scaling 0
cl_hud_color 4
r_fullscreen_gamma 2.2
