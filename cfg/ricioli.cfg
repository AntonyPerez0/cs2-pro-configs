// RICIOLI - CS2 config from https://copyprosta.com/p/ricioli/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/ricioli.cfg, then run: exec ricioli

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 155
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 2
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1.5
cl_radar_scale 1
cl_radar_rotate 1
cl_hud_radar_scale 1.095
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 0.85
safezoney 1
hud_scaling 0.81
cl_hud_color 9
fps_max 888
cl_showloadout 1
r_fullscreen_gamma 2.2
r_player_visibility_mode 1
