// Austin - CS2 config from https://copyprosta.com/p/austin/
// Converted from the pre-patch settings settings.gg lists for this player; the crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/austin.cfg, then run: exec austin

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 3
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_recoil 0
cl_crosshaircolor_r 27
cl_crosshaircolor_g 195
cl_crosshaircolor_b 144
cl_crosshaircolor_a 255
cl_crosshair_screen_height 1080
sensitivity 1.8
zoom_sensitivity_ratio 1.2
viewmodel_fov 64
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_radar_scale 0
cl_hud_radar_scale 1
hud_scaling 0
cl_hud_color 0
r_fullscreen_gamma 2.6
