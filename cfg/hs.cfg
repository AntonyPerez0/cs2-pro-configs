// HS - CS2 config from https://copyprosta.com/p/hs/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/hs.cfg, then run: exec hs

cl_crosshairstyle 4
cl_crosshair_length 4
cl_crosshair_thickness 1
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_screen_height 900
m_yaw 0.022
sensitivity 2.4
zoom_sensitivity_ratio 0.9
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -1.5
cl_radar_scale 0.647797
cl_radar_rotate 1
cl_hud_radar_scale 1.3
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 0.91059
safezoney 0.894542
hud_scaling 0.546143
cl_hud_color 1
cl_showloadout 1
r_fullscreen_gamma 2
r_player_visibility_mode 1
