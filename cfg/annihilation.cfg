// Annihilation - CS2 config from https://copyprosta.com/p/annihilation/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/annihilation.cfg, then run: exec annihilation

cl_crosshairstyle 4
cl_crosshair_length 5
cl_crosshair_thickness 2
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 250
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 255
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 1.48
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1.3
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.9
cl_hud_color 1
fps_max 0
cl_showloadout 1
r_fullscreen_gamma 1.1
