// slaxz- - CS2 config from https://copyprosta.com/p/slaxz-/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/slaxz-.cfg, then run: exec slaxz-

cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 200
cl_crosshair_screen_height 768
sensitivity 0.87
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1.15
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 0
hud_scaling 0.95
cl_hud_color 3
cl_allow_animated_avatars 0
fps_max 0
cl_showloadout 1
r_fullscreen_gamma 1.8
