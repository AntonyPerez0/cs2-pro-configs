// LUCAS1 - CS2 config from https://copyprosta.com/p/lucas1/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/lucas1.cfg, then run: exec lucas1

cl_crosshairstyle 2
cl_crosshair_length 5
cl_crosshair_thickness 1
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.5
cl_crosshair_dynamic_maxdist_splitratio 0
cl_crosshair_dynamic_spread_limit 255
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 960
m_yaw 0.022
sensitivity 2.2
zoom_sensitivity_ratio 1
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 1
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 0.9
safezoney 1
hud_scaling 0.9
cl_hud_color 0
cl_showloadout 1
r_fullscreen_gamma 1.1
