// awzek - CS2 config from https://copyprosta.com/p/awzek/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/awzek.cfg, then run: exec awzek

cl_crosshairstyle 4
cl_crosshair_length 1
cl_crosshair_thickness 2
cl_crosshair_gap 0
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 200
cl_crosshair_recoil 0
cl_crosshaircolor_r 255
cl_crosshaircolor_g 255
cl_crosshaircolor_b 255
cl_crosshaircolor_a 255
cl_crosshair_screen_height 768
m_yaw 0.022
sensitivity 1.59
zoom_sensitivity_ratio 1.08
viewmodel_fov 60
viewmodel_offset_x 1
viewmodel_offset_y 1
viewmodel_offset_z -1.5
cl_radar_scale 0.4
cl_radar_rotate 1
cl_hud_radar_scale 0.97
cl_radar_icon_scale_min 0.6
cl_radar_always_centered 1
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.95
cl_hud_color 4
cl_showloadout 1
r_fullscreen_gamma 2
r_player_visibility_mode 1
