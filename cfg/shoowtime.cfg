// SHOOWTiME - CS2 config from https://copyprosta.com/p/shoowtime/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/shoowtime.cfg, then run: exec shoowtime

cl_crosshairstyle 2
cl_crosshair_length 2
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 250
cl_crosshaircolor_a 255
cl_crosshair_dynamic_splitdist 3
cl_crosshair_dynamic_maxdist_splitratio 0
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.4
cl_crosshair_screen_height 960
sensitivity 1.9
zoom_sensitivity_ratio 1
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
r_fullscreen_gamma 1.1
