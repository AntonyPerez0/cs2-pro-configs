// Vexite - CS2 config from https://copyprosta.com/p/vexite/
// From the settings settings.gg lists for this player; the pre-patch crosshair
// is converted to the Sept 2026 crosshair system (community reconstruction).
// Save as Counter-Strike Global Offensive/game/csgo/cfg/vexite.cfg, then run: exec vexite

cl_crosshairstyle 4
cl_crosshair_length 1
cl_crosshair_thickness 2
cl_crosshair_gap 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 0
cl_crosshair_recoil 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshaircolor_a 210
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_screen_height 1080
m_yaw 0.022
sensitivity 1.15
zoom_sensitivity_ratio 0.7
viewmodel_fov 60
viewmodel_offset_x 1.5
viewmodel_offset_y 2
viewmodel_offset_z -1.5
cl_radar_scale 0.3
cl_radar_rotate 1
cl_hud_radar_scale 1.288498
cl_radar_icon_scale_min 0.4
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
safezonex 1
safezoney 1
hud_scaling 0.9
cl_hud_color 1
fps_max 0
cl_showloadout 1
r_fullscreen_gamma 2.2
r_player_visibility_mode 1
