name: Update pro settings data

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (crosshair converter)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Test crosshair conversion
        run: node scraper/test_crosshair.mjs

      - name: Run scraper
        run: python3 scraper/scrape.py

      - name: Try refresh HLTV top 10 (kept as-is when HLTV is blocked)
        run: python3 scraper/top10.py

      - name: Convert crosshairs to the current CS2 crosshair system
        run: node scraper/crosshair.mjs

      - name: Rebuild static pages (prerendered player pages, cfg files, sitemap)
        run: python3 scraper/sitegen.py

      - name: Check the generated site
        run: python3 scraper/test_site.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          (git commit -m "chore: refresh pro settings data [skip ci]" || echo "no changes")
          git push
